  - update
- apiGroups:
  - myelin.myelin.io
  resources:
  - myelinsecretpolicies/status
  - myelinsecrets/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
