  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - myelin.myelin.io
  resources:
  - myelinsecretpolicies
  - myelinsecrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
