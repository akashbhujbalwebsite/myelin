# This rule is not used by the project myelin itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the myelin.myelin.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: myelin
    app.kubernetes.io/managed-by: kustomize
  name: myelinsecretpolicy-editor-role
rules:
- apiGroups:
  - myelin.myelin.io
  resources:
  - myelinsecretpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - myelin.myelin.io
  resources:
  - myelinsecretpolicies/status
  verbs:
  - get
