    - myelin
    kind: MyelinSecret
    listKind: MyelinSecretList
    plural: myelinsecrets
    shortNames:
    - ms
    singular: myelinsecret
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.secretName
      name: Secret
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
