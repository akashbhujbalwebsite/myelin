name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Format check
        run: |
          gofmt -l . | tee /tmp/fmt.out
          test ! -s /tmp/fmt.out

      - name: Vet
        run: go vet ./...

      - name: Build operator
        run: go build ./cmd/operator/...

      - name: Build myelin CLI
        run: go build ./cmd/myelin/...

      - name: Run crypto unit tests
        run: go test -v -race ./internal/crypto/...

      - name: Setup envtest
        run: make setup-envtest

      - name: Run controller integration tests
        run: make test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: cover.out
          fail_ci_if_error: false

  docker-build:
    name: Docker Build (no push)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build operator image
        run: docker build --build-arg VERSION=${{ github.sha }} -t myelin-operator:ci .

  release:
    name: Release — push image & create GitHub release
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push operator image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/myelinio/myelin-operator:${{ github.ref_name }},ghcr.io/myelinio/myelin-operator:latest
          build-args: VERSION=${{ github.ref_name }}

      - name: Build CLI binaries
        run: |
          VERSION=${{ github.ref_name }}
          GOOS=linux  GOARCH=amd64 go build -ldflags="-X github.com/myelinio/myelin/internal/cli.Version=${VERSION}" -o dist/myelin-linux-amd64   ./cmd/myelin
          GOOS=linux  GOARCH=arm64 go build -ldflags="-X github.com/myelinio/myelin/internal/cli.Version=${VERSION}" -o dist/myelin-linux-arm64   ./cmd/myelin
          GOOS=darwin GOARCH=amd64 go build -ldflags="-X github.com/myelinio/myelin/internal/cli.Version=${VERSION}" -o dist/myelin-darwin-amd64  ./cmd/myelin
          GOOS=darwin GOARCH=arm64 go build -ldflags="-X github.com/myelinio/myelin/internal/cli.Version=${VERSION}" -o dist/myelin-darwin-arm64  ./cmd/myelin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/myelin-*
          generate_release_notes: true
